# Раскладка объекта: комнаты, что в них стоит и какие камеры снимают.
#
# Правит инженер на месте, пересборка не нужна. Файл подключается так:
#
#	telemetryd -rooms rooms.yaml -video-root /tmp/mchs-video
#
# Пароли камер можно не писать в файл — ${CAM_PASS} берётся из окружения.

site: obj-17

rooms:
  # Комната тренажёров: велосипед, лестница, силовая установка,
  # тепловая пушка и две камеры.
  - id: room-1
    name: "Теплокамера"

    devices:
      - id: obj-17-bike-1
        name: "Велосипед"
        kind: bike          # датчик Холла на колесе: скорость, путь

      - id: obj-17-stairs-1
        name: "Лестница"
        kind: stairs        # прохождение этажей; контракт в согласовании

      - id: obj-17-load-1
        name: "Силовая установка"
        kind: load          # подъём груза подходами; контракт в согласовании

    # Уставки защиты держатся рядом с комнатой: воздух в зале с
    # лестницей и грузом прогревается иначе, чем там, где крутят педали.
    heater:
      device: obj-17-heater-1
      limit_c: 60           # порог отключения
      resume_c: 50          # температура возврата, обязательно ниже порога

    cameras:
      - id: room1-cam-1
        name: "Зал, общий план"
        url: "rtsp://admin:mchs2026@192.168.1.64:554/Streaming/channels/101"
        transport: tcp
        location: "над входом"

      - id: room1-cam-2
        name: "Зал, лестница и груз"
        url: "rtsp://admin:mchs2026@192.168.1.65:554/Streaming/channels/101"
        transport: tcp
        location: "дальний угол"

  # Остальные две комнаты — заготовки: состав появится, когда их оснастят.
  - id: room-2
    name: "Дымокамера, комната 1"
    devices: []

  - id: room-3
    name: "Дымокамера, комната 2"
    devices: []
