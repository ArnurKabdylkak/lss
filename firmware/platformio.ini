; PlatformIO Project Configuration
; STM32F767ZI + libopencm3

[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = libopencm3

; Роль выбирается сборкой: в прошивку попадает ровно один главный
; цикл. По умолчанию — стойка набора чисел.
build_src_filter = +<*> -<role_fire.c> -<role_load.c>

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200

build_flags =
    -Wall
    -Wextra
    -O2
    -ffunction-sections
    -fdata-sections

; lwIP лежит в lib/lwip со своим library.json
lib_ldf_mode = deep+

build_unflags =

; --- Платы объекта -----------------------------------------------------
;
; Адрес платы и адрес её сборщика задаются здесь, а не в исходнике:
; прошивка одна на все стойки, а стоят они в разных помещениях и
; отчитываются разным сборщикам.
;
; Карта адресов — network-plan.xlsx и deploy/host_vars сборщиков:
; сборщики .10/.11/.12 по комнатам, платы с .50.

; --- Стойки набора чисел ---------------------------------------------
;
; Стойка набора чисел, дымокамера 1 этаж (obj-17-code-1).
[env:code_room2]
extends = env:nucleo_f767zi
build_flags =
    ${env:nucleo_f767zi.build_flags}
    -D NET_LOCAL_IP=\"192.168.1.60\"
    -D NET_SERVER_IP=\"192.168.1.11\"

; То же, но со шестнадцатеричной клавиатурой (0–9, A–F): на ней нет
; «решётки» и «звёздочки», поэтому подтверждение и стирание назначены
; на E и F.
[env:code_room2_hex]
extends = env:code_room2
build_flags =
    ${env:code_room2.build_flags}
    -D KEYPAD_LAYOUT_HEX=1
    -D CODE_KEY_ENTER=69   ; 'E'
    -D CODE_KEY_CLEAR=70   ; 'F'

; Вариант для «голой» платы STM32F767 без Nucleo (раскомментировать при надобности)
; [env:genericSTM32F767ZI]
; platform = ststm32
; board = genericSTM32F767ZI
; framework = libopencm3
; upload_protocol = stlink

; Поиск разводки клавиатуры. Заливается временно, при монтаже: сети и
; проверки кода в этом режиме нет, только ноги разъёма и консоль.
[env:discover]
extends = env:nucleo_f767zi
build_flags =
    ${env:nucleo_f767zi.build_flags}
    -D DISCOVER_MODE=1

; --- Имитаторы очага --------------------------------------------------
;
; Очаг загорается сам в случайный момент и гаснет кнопкой на себе.
; Реле на D10 (PD14), управление прямое: единица включает нагрузку.
; Кнопка тушения на D8 (PF12), замыкание на землю.

; Очаг дымокамеры, 1 этаж (obj-17-fire-1).
[env:fire_room2]
extends = env:nucleo_f767zi
build_src_filter = +<*> -<role_stand.c> -<role_load.c>
build_flags =
    ${env:nucleo_f767zi.build_flags}
    -D FIRE_ROLE=1
    -D NET_LOCAL_IP=\"192.168.1.61\"
    -D NET_SERVER_IP=\"192.168.1.11\"

; Очаг дымокамеры, 2 этаж (obj-17-fire-2).
[env:fire_room3]
extends = env:nucleo_f767zi
build_src_filter = +<*> -<role_stand.c> -<role_load.c>
build_flags =
    ${env:nucleo_f767zi.build_flags}
    -D FIRE_ROLE=1
    -D NET_LOCAL_IP=\"192.168.1.73\"
    -D NET_SERVER_IP=\"192.168.1.12\"

; --- Ударный молот ----------------------------------------------------
;
; Счёт повторений герконом: магнит проходит мимо него дважды за цикл,
; и повторением считается каждое второе срабатывание.
;
; Геркон на D8 (PF12), замыкание на землю.

[env:load_room1]
extends = env:nucleo_f767zi
build_src_filter = +<*> -<role_stand.c> -<role_fire.c>
build_flags =
    ${env:nucleo_f767zi.build_flags}
    -D NET_LOCAL_IP=\"192.168.1.50\"
    -D NET_SERVER_IP=\"192.168.1.10\"
