# Перенос сборщика телеметрии на объекты.
[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent

# Запас на поднятие прав: пока имя хоста не разрешается, sudo ждёт
# таймаут DNS и не успевает выдать приглашение за отведённые по
# умолчанию 10 секунд. Роль это лечит, но до первого прогона запас
# нужен, иначе деплой падает на первой же задаче.
timeout = 30
stdout_callback = ansible.builtin.default
result_format = yaml
display_skipped_hosts = False

[ssh_connection]
pipelining = True

# Первый заход на новую машину не должен упираться в вопрос о ключе:
# карта только что подготовлена, ключ хоста у неё заведомо новый.
# Подмену ключа при этом по-прежнему заметим — accept-new принимает
# только неизвестные, но не изменившиеся.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
