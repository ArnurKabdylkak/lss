---
# Куда ставится служба.
install_dir: /opt/mchs
config_dir: /etc/mchs
service_name: mchs-pult
service_user: mchs
build_dir: "{{ playbook_dir }}/../bin"

# Центр: тот же адрес, что знают сборщики.
center_url: "http://192.168.1.2:8080"
center_login: "pult"
center_timeout: 3s

# Шина расширителей. Включается dtparam в прошивке и модулем i2c-dev —
# обе вещи делает роль.
i2c_device: /dev/i2c-1

# Периоды опроса. Выдержка делится на период опроса — получается
# шесть выборок на решение: одиночная наводка отнимает один шаг и
# состояние кнопки не меняет. Читается только порт кнопок, поэтому
# шина остаётся свободной.
scan: 5ms
debounce: 30ms
poll: 500ms
blink: 400ms

# Сборщики для прямой аварии, минуя центр.
collectors:
  - {room: room-1, url: "http://192.168.1.10:8080"}
  - {room: room-2, url: "http://192.168.1.11:8080"}
  - {room: room-3, url: "http://192.168.1.12:8080"}

# Секреты в репозиторий не пишутся: берутся из окружения того, кто
# запускает выкладку. Токен аварии должен совпадать с тем, что стоит
# у сборщиков (MCHS_ALARM_TOKEN в их группе).
center_password: "{{ lookup('env', 'PULT_PASS') }}"
alarm_token: "{{ lookup('env', 'MCHS_ALARM_TOKEN') }}"

# Сервер времени контура — центр. У Raspberry Pi нет часов с
# батарейкой, а журнал нажатий без верного времени бесполезен.
ntp_servers: ["192.168.1.2", "192.168.1.3", "192.168.1.1"]

# Раскладка пульта: кнопки на порту B, светодиоды на порту A.
# Позиция общая — кнопка B2 и её лампа A2 принадлежат одному узлу.
#
# Лампа горит не по нажатию, а по подтверждению сборщика: оператор
# у пульта должен видеть, что реле щёлкнуло, а не то, что он нажал.
#
# Порядок ног внутри порта проверяется калибровкой
#   sudo /opt/mchs/bin/pultd -calibrate -calibrate-out /tmp/layout.yml
# и перенесите результат сюда.
#
# Адрес микросхемы задан её ногами A0/A1/A2.
emergency:
  addr: "0x20"
  button: B7
  lamp: A7
  # Грибок срабатывает замыканием: на объекте он собран нормально
  # разомкнутым. Обрыв линии при такой схеме остаётся незамеченным —
  # это цена за то, что цепь соответствует смонтированной.
  normally_closed: false
  reason: "аварийная кнопка на пульте"

# Светодиод зажигается подачей питания на ногу, а не прижатием к
# земле: при обратной полярности лампы горели бы у выключенных узлов.
lamps_source_voltage: true

rooms:
  # Порядок рядов на пульте сверху вниз: теплокамера, первый этаж
  # дымокамеры, второй. Ряд — это микросхема, и адреса идут по
  # возрастанию, чтобы ряд на панели и ряд в файле совпадали.
  #
  # Порядок кнопок одинаков во всех комнатах, насколько позволяет
  # оборудование: освещение, пушка, вытяжка — всегда B0, B1, B2.
  # Так оператор не ищет кнопку глазами, переходя от зала к залу.
  - id: room-1
    name: "Теплокамера"
    addr: "0x20"
    units:
      - {unit: light,  name: "Освещение",            button: B0, lamp: A0}
      - {unit: heat,   name: "Тепловая пушка",       button: B1, lamp: A1}
      - {unit: fan,    name: "Вытяжка",              button: B2, lamp: A2}
      - {unit: stairs, name: "Бесконечная лестница", button: B3, lamp: A3}

  - id: room-2
    name: "Дымокамера, комната 1"
    addr: "0x22"
    units:
      - {unit: light,  name: "Освещение",      button: B0, lamp: A0}
      - {unit: heat,   name: "Тепловая пушка", button: B1, lamp: A1}
      - {unit: fan,    name: "Вытяжка",        button: B2, lamp: A2}
      - {unit: smoke,  name: "Дымогенератор",  button: B3, lamp: A3}
      - {unit: strobe, name: "Стробоскоп",     button: B4, lamp: A4}
      - {unit: sound,  name: "Аудиоэффекты",   button: B5, lamp: A5}
      - {unit: flood,  name: "Прожекторы",     button: B6, lamp: A6}

  - id: room-3
    name: "Дымокамера, комната 2"
    addr: "0x24"
    units:
      - {unit: light,  name: "Освещение",      button: B0, lamp: A0}
      - {unit: heat,   name: "Тепловая пушка", button: B1, lamp: A1}
      - {unit: fan,    name: "Вытяжка",        button: B2, lamp: A2}
      - {unit: smoke,  name: "Дымогенератор",  button: B3, lamp: A3}
      - {unit: strobe, name: "Стробоскоп",     button: B4, lamp: A4}
      - {unit: sound,  name: "Аудиоэффекты",   button: B5, lamp: A5}
      - {unit: rubble, name: "Завалы",         button: B6, lamp: A6}
