# Пульт — четвёртое устройство контура, рядом с залами.
#
# Сеть та же плоская 192.168.1.0/24: шлюз .1, центр .2, сборщики
# .10/.11/.12. Пульту отведён .13.
#
# Первый заход — по паролю:
#   ssh-copy-id pult@192.168.1.13
# Дальше по ключу. Пароли в файлы не вписывайте: репозиторий открыт.
all:
  children:
    pult:
      hosts:
        pult1:
          ansible_host: 192.168.1.13
          ansible_user: pult
