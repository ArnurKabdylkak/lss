# Пульт управления тренажёрным комплексом.
#
# Три расширителя MCP23017 на шине I2C: по микросхеме на помещение.
# Кнопки сидят на порту A (вход, подтяжка к питанию, замыкание на
# землю), лампы — на порту B (выход). Нумерация ног в схемотехнике
# MCP23017: A0..A7 и B0..B7.
#
# Адрес микросхемы задаётся ногами A0/A1/A2 самой микросхемы:
#   0x20 — все три на землю, 0x21 — A0 на питание, 0x22 — A1, 0x24 — A2.
# Адреса ниже — те, что реально распаяны на объекте; проверить можно
# командой pultd -probe.
#
# Узлы (поле unit) называются ровно так же, как в rooms.yaml центра:
# пульт отправляет их в команду, и расхождение в одну букву означает
# кнопку, которая молча ничего не делает.

center:
  url: "http://192.168.1.2:8080"
  login: "pult"
  # Пароль держится в окружении: файл правится на объекте и лежит на
  # карте, которую можно вынуть.
  password: "${PULT_PASS}"
  timeout: 3s

i2c:
  device: /dev/i2c-1

timing:
  scan: 5ms       # опрос кнопок
  debounce: 30ms  # сколько кнопка должна держать уровень
  # Выдержка делится на период опроса: шесть выборок на решение.
  # Одиночная наводка отнимает один шаг и решения не меняет.
  poll: 500ms     # чтение состояния из центра
  blink: 400ms    # мигание лампы узла, ждущего подтверждения

# Аварийный грибок — один на весь объект. Сидит на свободных ногах
# микросхемы первого помещения.
emergency:
  addr: 0x20
  button: B7
  lamp: A7
  # Нормально замкнутый: в покое цепь целая, нажатие её размыкает.
  # Обрыв провода выглядит как нажатие — отказ в безопасную сторону.
  normally_closed: false
  reason: "аварийная кнопка на пульте"

lamps_source_voltage: true

rooms:
  # Порядок кнопок одинаков во всех комнатах, насколько позволяет
  # оборудование: освещение, пушка, вытяжка — всегда B0, B1, B2.
  # Так оператор не ищет кнопку глазами, переходя от зала к залу.
  - id: room-1
    name: "Теплокамера"
    addr: 0x20
    units:
      - {unit: light,  name: "Освещение",            button: B0, lamp: A0}
      - {unit: heat,   name: "Тепловая пушка",       button: B1, lamp: A1}
      - {unit: fan,    name: "Вытяжка",              button: B2, lamp: A2}
      - {unit: stairs, name: "Бесконечная лестница", button: B3, lamp: A3}

  - id: room-2
    name: "Дымокамера, комната 1"
    addr: 0x22
    units:
      - {unit: light,  name: "Освещение",      button: B0, lamp: A0}
      - {unit: heat,   name: "Тепловая пушка", button: B1, lamp: A1}
      - {unit: fan,    name: "Вытяжка",        button: B2, lamp: A2}
      - {unit: smoke,  name: "Дымогенератор",  button: B3, lamp: A3}
      - {unit: strobe, name: "Стробоскоп",     button: B4, lamp: A4}
      - {unit: sound,  name: "Аудиоэффекты",   button: B5, lamp: A5}
      - {unit: flood,  name: "Прожекторы",     button: B6, lamp: A6}

  - id: room-3
    name: "Дымокамера, комната 2"
    addr: 0x24
    units:
      - {unit: light,  name: "Освещение",      button: B0, lamp: A0}
      - {unit: heat,   name: "Тепловая пушка", button: B1, lamp: A1}
      - {unit: fan,    name: "Вытяжка",        button: B2, lamp: A2}
      - {unit: smoke,  name: "Дымогенератор",  button: B3, lamp: A3}
      - {unit: strobe, name: "Стробоскоп",     button: B4, lamp: A4}
      - {unit: sound,  name: "Аудиоэффекты",   button: B5, lamp: A5}
      - {unit: rubble, name: "Завалы",         button: B6, lamp: A6}

# Запасной путь аварии: когда центр не отвечает, остановка уходит
# прямо сборщикам помещений. Обычные кнопки так не ходят — сценарий
# и журнал живут в центре.
direct_token: "${PULT_ALARM_TOKEN}"
collectors:
  - {room: room-1, url: "http://192.168.1.10:8080"}
  - {room: room-2, url: "http://192.168.1.11:8080"}
  - {room: room-3, url: "http://192.168.1.12:8080"}
