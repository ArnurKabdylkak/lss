# Сборщик телеметрии на объекте.
# Комплекс один на три комнаты: центр раскладывает устройства по
# комнатам не по site, а по device_id, и закрепляет показания за
# карточкой спасателя. Отсюда приставка комнаты у каждого имени.
site: lss

# Приём от плат и локальная панель.
listen: ":5005"
http: ":8080"

# Пауза, после которой устройство считается пропавшим. Считается здесь:
# сборщик видит настоящий поток, центр получает данные пачками.
silence: 3s

center:
  # Узел центра: 192.168.1.2 (network-plan.xlsx, лист «Адресация»).
  # Вход сборщика открыт без сессии, поэтому token пуст.
  url: "http://192.168.1.2:8080"
  token: ""
  every: 1s
  timeout: 10s
  max_batch: 500

buffer:
  path: "buffer.jsonl"
  # По достижении предела вытесняются самые старые показания.
  # События реле не вытесняются никогда.
  max_records: 200000

# Карта устройств: плата своего идентификатора не передаёт, опознать её
# больше нечем. Уставки досылаются после перезапуска платы — она их
# не хранит.
devices:
  - addr: "192.168.1.50"
    id: "heat-hammer"
    limits:
      limit_c: 40.0
      restore_c: 37.0
      period_ms: 200

# Пакеты с адресов, которых нет в карте, отбрасываются.
accept_unknown: false

# Собственные датчики сборщика.
sensors:
  enabled: true
  device: "/dev/i2c-1"
  # BMP280 на 0x77 (адрес подтверждён i2cdetect; у части плат 0x76).
  # Сборщик проверяет chip id и откажется работать, если на адресе
  # окажется не тот чип.
  addr: 0x77
  every: 1s
  id: "heat-rpi"

# Реле на выводах сборщика.
#
# Теплокамера: тепловая пушка, светильники, вытяжка (network-plan.xlsx,
# лист «Адресация»).
outputs:
  enabled: true
  chip: "/dev/gpiochip0"
  active_low: true
  open_drain: true

  lines:
    - id: gpio-17
      line: 17
      kind: switch

    - id: gpio-27
      line: 27
      kind: switch

    - id: gpio-22
      line: 22
      kind: switch

    - id: gpio-5
      line: 5
      kind: switch

    - id: gpio-6
      line: 6
      kind: switch

    - id: gpio-13
      line: 13
      kind: switch

    - id: gpio-19
      line: 19
      kind: switch

    - id: gpio-26
      line: 26
      kind: switch

# Выводы, которые прошивка выставляет до запуска сборщика, задаются в
# /boot/firmware/config.txt — иначе реле щёлкают при каждой загрузке:
#     gpio=17=op,dh
# Уровень там физический: dh (HIGH) при active_low — реле разомкнуто.
