# Общее для всех объектов.
---
# Объект комплекса. Совпадает с полем site в rooms.yaml центра:
# очередь команд ведётся по нему, и расхождение означало бы, что
# сборщик опрашивает пустую очередь, а оператор не понимает, почему
# ничего не включается.
site: obj-17

# Куда выгружать данные. Адрес центра один на все объекты.
# Вход сборщика в центре: POST /api/v1/telemetry и /acks, без токена —
# центр пускает сборщик без сессии.
#
# Адрес обязан указывать на telemetryd БЕЗ видео. У центра это два
# отдельных процесса именно потому, что от телеметрии зависит тепловая
# защита, и ронять её вместе с видеотрактом нельзя (ARCHITECTURE.md
# §6.2). Порт видеопроцесса сюда вписывать не следует.
#
# Узел центра: 192.168.1.2, порт telemetryd (network-plan.xlsx,
# лист «Адресация»).
center_url: "http://192.168.1.2:8080"

# Токен сборщика. Держать в ansible-vault, а не здесь:
#   ansible-vault encrypt_string --name center_token 'ТОКЕН'
# и вставить результат в host_vars объекта.
center_token: ""

# Приём от плат и локальная панель.
listen: ":5005"
http_listen: ":8080"

# Секрет аварийной остановки с пульта. В репозиторий не пишется:
# берётся из окружения того, кто запускает деплой, и должен совпадать
# с PULT_ALARM_TOKEN на пульте.
#   export MCHS_ALARM_TOKEN=...
alarm_token: "{{ lookup('env', 'MCHS_ALARM_TOKEN') }}"

# Реле на выводах сборщика. Обвязка одинаковая на всех объектах:
# модули с оптопарой, питание 5 В, управление открытым коллектором.
outputs_enabled: true
outputs_chip: "/dev/gpiochip0"
outputs_active_low: true
outputs_open_drain: true

# Умолчания тепловой защиты. Применяются к выходам с kind: heater,
# у которых уставки не заданы поимённо.
heater_limit_c: 60.0
heater_restore_c: 50.0
heater_min_off: 30s
heater_board_ttl: 5s
heater_disagree_c: 5.0

# Правки в /boot/firmware/config.txt требуют перезагрузки. Объект с
# пушкой сам себя не перезагружает: решает тот, кто стоит рядом.
# Плейбук только сообщает, что перезагрузка нужна.
allow_reboot: false

# Акустика зала: сообщения записаны на месте, центр лишь указывает,
# какое воспроизвести. Так фраза звучит одинаково и не зависит от
# связи в момент аварии.

# Узлы помещения по умолчанию: теплокамера. У дымокамер состав свой,
# он задан в host_vars — логика одинаковая, различается обвязка.
room_units:
  - {unit: light, outputs: [gpio-17], on_prepare: true,  on_alarm: "on"}
  - {unit: fan,   outputs: [gpio-27], on_prepare: false, on_alarm: "on"}
  - {unit: heat,  outputs: [gpio-22], on_prepare: true,  on_alarm: "off"}

room_rubble: []
room_locks: [gpio-5]

# Серверы времени. Первым идёт машина центра: у Raspberry Pi нет часов
# с батарейкой, после обесточивания шкала уезжает, а метку приёма
# телеметрии ставит именно сборщик — центр считает показания с
# уехавшими часами устаревшими и показывает «нет датчика».
#
# Отдельный узел (.3) по плану сети ещё не поднят, он оставлен в
# списке на будущее.
ntp_servers: ["192.168.1.2", "192.168.1.3", "192.168.1.1"]
