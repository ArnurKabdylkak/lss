# Значения, которые редко меняют.
---
# Куда ставится сборщик.
install_dir: /opt/mchs
config_dir: /etc/mchs
# Буфер телеметрии. Отдельно от /opt: при обновлении бинаря данные,
# ещё не отданные в центр, трогать нельзя.
state_dir: /var/lib/mchs

service_name: mchs-collector
# Отдельный системный пользователь, намеренно не совпадающий с тем, под
# которым заходят по SSH: роль выставляет ему nologin, и совпадение
# закрыло бы живому администратору вход на объект.
service_user: mchs-svc

# Где собирается бинарь на управляющей машине.
build_dir: "{{ playbook_dir }}/../bin"

# Пауза, после которой устройство считается пропавшим.
silence: 3s

# Период обращения к центру. Он же задержка исполнения команды:
# команды приходят в ответе на выгрузку, своего канала к объекту нет.
# Секунда — ради света и звука на занятии, где пять секунд инструктор
# уже чувствует; для нагрева задержка роли не играет.
center_every: 1s
center_timeout: 10s
center_max_batch: 500

# Предел буфера. По достижении вытесняются самые старые показания;
# события реле не вытесняются никогда.
buffer_max_records: 200000

accept_unknown: false

sensors_enabled: false
sensors_every: 1s

# Серверы времени контура. Пусто — остаются системные, недостижимые в
# изолированной сети. Вписать адрес, как только он появится.
ntp_servers: []
