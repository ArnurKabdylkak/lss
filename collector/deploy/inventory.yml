# Сборщики комплекса: по одному на помещение.
#
# Адреса статические, из network-plan.xlsx (лист «Адресация»):
# сеть плоская, 192.168.1.0/24, шлюз .1, центр .2. Имя хоста на
# машине своё (rpi_room1…3), но обращаемся по адресу: имена в этом
# контуре никто не разрешает, а DNS ради трёх машин не поднимают.
#
# Первый заход — по паролю:
#   ssh-copy-id room1@192.168.1.10   (и так для room2, room3)
# Дальше выкладка идёт по ключу и пароля не спрашивает. Без ключа:
#   make deploy ANSIBLE_ARGS="--ask-pass --ask-become-pass"
# Пароли в файлы не вписывайте: репозиторий лежит открытым.
all:
  children:
    collectors:
      hosts:
        # Теплокамера. Хост rpi_room1.
        room1:
          ansible_host: 192.168.1.10
          ansible_user: room1

        # Дымокамера, комната 1. Хост rpi_room2.
        room2:
          ansible_host: 192.168.1.11
          ansible_user: room2

        # Дымокамера, комната 2: здесь же механизм «Завалы».
        # Хост rpi_room3.
        room3:
          ansible_host: 192.168.1.12
          ansible_user: room3
